<div class="flex flex-col items-center justify-center lg:pt-10 lg:pr-20 lg:pl-20 sm:pt-14 sm:pr-6 sm:pb-14 sm:pl-6 min-h-screen relative font-display
            bg-gradient-to-b from-blue-bg/40 to-blue-bg/90 text-white ">
    <!-- Background Image -->
    <div class="background bg-blue-bg"></div>

    <!-- Logo -->
    <div class="hidden md:flex w-full h-[80px] items-center px-6">
      <img src="/icons/logo.svg" alt="Logo" class="h-[40px] w-[141.1px]">
    </div>

    <!-- Contenedor centrado para validation -->
    <div class="flex flex-1 items-center justify-center w-full">
      <div class="relative bg-transparent text-center max-w-[95%] md:w-[440px] w-[342px]">
        <!-- Progress Bar -->
        <div class="flex justify-center items-center mb-6 space-x-2 sm:space-x-4 w-full">
          <div *ngFor="let stepNumber of [1,2,3,4]; " class="flex items-center w-full last:w-auto">
            <div  
              [ngClass]="{
                'bg-button text-white': step >= stepNumber, 
                'bg-white text-gray-400 font-medium': step < stepNumber
              }" 
              class="w-[40px] h-[40px] md:w-[56px] md:h-[56px] flex items-center justify-center rounded-full z-10 font-semibold text-[16px] md:text-[22.4px]">
              {{ stepNumber }}
            </div>
            <div *ngIf="stepNumber < 4" 
              [ngClass]="{
                'bg-button': step > stepNumber, 
                'bg-gray-300': step <= stepNumber
              }" 
              class="flex-1 h-[2px] mx-2">
            </div>
          </div>
        </div>

        <!-- Step Titles -->
        <h2 class="text-white text-2xl font-bold">Validación crediticia</h2>
        <p class="text-white text-sm mb-6">Datos clave sobre tu historial en el sistema financiero</p>

        <!-- Form Steps -->
        <form [formGroup]="form" (ngSubmit)="submitForm()">
          
          <!-- Step 1: Bank Selection -->
          <div *ngIf="step === 1" class="w-full bg-blue-bg bg-opacity-30 p-6 rounded-lg text-white 
          shadow-[0px_3px_60px_-10px_rgba(84,164,255,0.8)] border-[0.5px] border-white/60">
            <p class="mb-4 font-semibold">¿En qué banco solicitaste una tarjeta de crédito durante los últimos seis meses?</p>
            <label *ngFor="let bank of ['Bancolombia', 'Banco de Bogotá', 'Davivienda', 'Banco BBVA Colombia']" class="flex items-center space-x-2 mb-2">
              <input type="radio" formControlName="bankSelection" [value]="bank" class="form-radio text-blue-500">
              <span>{{ bank }}</span>
            </label>
          </div>

          <!-- Step 2: Salary Range -->
          <div *ngIf="step === 2" class="bg-blue-bg bg-opacity-30 p-6 rounded-lg text-white 
          shadow-[0px_3px_60px_-10px_rgba(84,164,255,0.8)] border-[0.5px] border-white/60">
            <p class="mb-4 font-semibold">¿Cuál es tu rango de salario mensual?</p>
            <label *ngFor="let salary of ['Menos de $1,000,000', '$1,000,000 - $3,000,000', '$3,000,000 - $5,000,000', 'Más de $5,000,000']" class="flex items-center space-x-2 mb-2">
              <input type="radio" formControlName="salaryRange" [value]="salary" class="form-radio text-blue-500">
              <span>{{ salary }}</span>
            </label>
          </div>

          <!-- Step 3: Loan Purpose -->
          <div *ngIf="step === 3" class="bg-blue-bg bg-opacity-30 p-6 rounded-lg text-white 
          shadow-[0px_3px_60px_-10px_rgba(84,164,255,0.8)] border-[0.5px] border-white/60">
            <p class="mb-4 font-semibold">¿Para qué necesitas este crédito?</p>
            <label *ngFor="let purpose of ['Viaje', 'Renovación del hogar', 'Negocio', 'Otro']" class="flex items-center space-x-2 mb-2">
              <input type="radio" formControlName="loanPurpose" [value]="purpose" class="form-radio text-blue-500">
              <span>{{ purpose }}</span>
            </label>
          </div>

          <!-- Step 4: Other Loans -->
          <div *ngIf="step === 4" class="bg-blue-bg bg-opacity-30 p-6 rounded-lg text-white 
          shadow-[0px_3px_60px_-10px_rgba(84,164,255,0.8)] border-[0.5px] border-white/60">
            <p class="mb-4 font-semibold">¿Tienes otro crédito activo actualmente?</p>
            <label *ngFor="let loan of ['Sí', 'No']" class="flex items-center space-x-2 mb-2">
              <input type="radio" formControlName="otherLoans" [value]="loan" class="form-radio text-blue-500">
              <span>{{ loan }}</span>
            </label>
          </div>

          <hr class="border-t border-button mt-6 mb-3">

          <!-- Navigation Buttons -->
          <div class="flex flex-row space-x-4 w-full max-w-md mx-auto text-sm md:text-lg">
            <button type="button" (click)="prevStep()" [class.invisible]="step === 1"
              class="flex-1 px-4 py-3 bg-button text-white rounded-lg font-medium cursor-pointer text-center">
              Anterior
            </button>
          
            <button *ngIf="step < 4" type="button" (click)="nextStep()"
              class="flex-1 px-4 py-3 bg-button text-white rounded-lg font-medium cursor-pointer text-center">
              Siguiente <img src="/icons/arrow-button.svg" class="w-auto h-auto inline-block"/>
            </button>
          
            <button *ngIf="step === 4" type="submit"
              class="flex-1 px-4 py-3 bg-button text-white rounded-lg font-medium cursor-pointer text-center">
              Enviar
            </button>
          </div>

        </form>
      </div>
    </div>
</div>
