<div class="flex flex-col items-center justify-center lg:pt-10 lg:pr-20 lg:pl-20 sm:pt-14 sm:pr-6 sm:pb-14 sm:pl-6 min-h-screen relative font-display
            bg-gradient-to-b from-blue-bg/40 to-blue-bg/90 text-white ">
    <!-- Background Image -->
    <div class="background bg-blue-bg"></div>
    <!-- Logo -->
    <div class="hidden md:flex w-full h-[80px] items-center px-6">
        <img src="/icons/logo.svg" alt="Logo" class="h-[40px] w-[141.1px]">
    </div>
    <div class="relative text-center w-[342px] md:w-[600px] lg:w-[900px] h-auto m-auto border-none bg-transparent">
        <!-- Encabezado -->
        <h2 class="text-white text-[24px] md:text-[32px] font-bold mb-2">Condiciones del crédito</h2>
        <p class="text-white text-[16px] text-[20px] font-medium mb-6">Revisa todos los detalles</p>

        <!-- Expansibles con Angular Material -->
        <div class="bg-transparent rounded-lg w-full text-left">
            <div *ngFor="let condition of conditions; let i = index" 
            class="rounded-lg transition-all duration-300 mb-2 bg-transparent border border-white border-none">
                <!-- Encabezado del panel -->
                <button 
                    (click)="togglePanel(i)" 
                    class="w-full text-white text-[14px] md:text-[20px] font-semibold flex items-center justify-between py-3 focus:outline-none">
                    {{ condition.title }}
                    <img src="/icons/arrow.svg" alt="Arrow" 
                        [style.transform]="openPanel === i ? 'rotate(0deg)' : 'rotate(-90deg)'" 
                        class="w-[16px] transition-transform duration-300">
                </button>
                <!-- Contenido del panel (con transición de altura) -->
                <div 
                    [class.max-h-0]="openPanel !== i" 
                    [class.max-h-96]="openPanel === i"
                    class="overflow-hidden transition-all duration-300 ease-in-out bg-transparent border-t border-white border-opacity-50">
                    <p class="text-sm text-white py-3">{{ condition.content }}</p>
                </div>
            </div>
        </div>
        

        <!-- Botones -->
        <div class="flex flex-row justify-end mt-6 gap-4 w-full">
            <button mat-button color="warn" (click)="reject()" 
                    class="w-auto min-w-[143px] h-[56px] bg-white text-blue-bg text-[16px] font-medium px-[24px] py-[16px] rounded-[8px] border-2 border-transparent shadow-md cursor-pointer flex items-center justify-center gap-[16px]">
                Rechazar
            </button>
            <button mat-raised-button color="primary" (click)="accept()" 
                    class="w-auto min-w-[143px] h-[56px] bg-button text-white text-[18px] font-bold px-[24px] py-[16px] rounded-[8px] border-2 border-transparent shadow-md cursor-pointer flex items-center justify-center gap-[16px] ">
                Continuar <img src="/icons/arrow-button.svg" alt="" class="w-5 h-5">
            </button>
        </div>
    </div>
</div>
