<div class="flex flex-col items-center justify-center min-h-screen relative font-display
            bg-gradient-to-b from-blue-bg/40 to-blue-bg/90 px-4">
    <!-- Background Image -->
    <div class="background bg-blue-bg"></div>

    <mat-card class="relative p-6 text-center w-full max-w-2xl lg:max-w-4xl border-none bg-transparent">
        <!-- Encabezado -->
        <h2 class="text-white text-3xl font-bold mb-2">Condiciones del crédito</h2>
        <p class="text-gray-200 text-md mb-6">Revisa todos los detalles antes de continuar</p>

        <!-- Expansibles con Angular Material -->
        <mat-accordion class="bg-transparent rounded-lg shadow-lg">
    <ng-container *ngFor="let condition of conditions; let i = index">
        <mat-expansion-panel class="bg-white bg-opacity-10 rounded-lg transition-all">
            <mat-expansion-panel-header class="text-white text-lg font-semibold flex items-center">
                <!-- <mat-icon class="mr-2">info</mat-icon>  -->
                {{ condition.title }}
            </mat-expansion-panel-header>
            <mat-list class="p-4">
                <mat-list-item class="text-sm text-gray-300">{{ condition.content }}</mat-list-item>
            </mat-list>
        </mat-expansion-panel>
        
        <!-- Línea blanca entre paneles -->
        <hr *ngIf="i < conditions.length - 1" class="border-t border-white opacity-50 my-2">
    </ng-container>
</mat-accordion>

        <!-- Botones -->
        <div class="flex justify-between mt-6">
            <button mat-button color="warn" (click)="reject()" 
                class="bg-red-600 text-white px-6 py-2 rounded-lg shadow-md hover:bg-red-700 transition">
                Rechazar
            </button>
            <button mat-raised-button color="primary" (click)="accept()" 
                class="bg-blue-500 text-white px-6 py-2 rounded-lg shadow-md hover:bg-blue-600 flex items-center transition">
                Continuar
            </button>
        </div>
    </mat-card>
</div>
