<form [formGroup]="form" (ngSubmit)="submitForm()" class="w-full bg-transparent bg-opacity-30 text-left rounded-lg shadow-xl text-white mt-6 gap-[16px] flex flex-col">
  
  <div class="flex flex-col md:flex-row gap-4">
    <div class="w-full md:w-[440px] sm:w-[342px]">
      <label class="block text-sm pb-2">NIT</label>
      <input type="text" formControlName="nit" placeholder="Ingresar NIT" class="w-full h-[56px] border border-gray-300 rounded-lg bg-gray-100 placeholder-border-ip font-semibold text-text-ip font-medium focus:border-border-ip focus:ring-0 focus:outline-none p-[12px_16px]">
    </div>

    <div class="w-full md:w-[440px] sm:w-[342px]">
      <label class="block text-sm pb-2">Razón Social</label>
      <input type="text" formControlName="razonSocial" placeholder="Ingresar Razón Social" class="w-full h-[56px] border border-gray-300 rounded-lg bg-gray-100 placeholder-border-ip font-semibold text-text-ip font-medium focus:border-border-ip focus:ring-0 focus:outline-none p-[12px_16px]">
    </div>
  </div>

  <div class="flex flex-col md:flex-row gap-4 mt-4">
    <div class="w-full md:w-[440px] sm:w-[342px]">
      <label class="block text-sm pb-2">Correo Electrónico</label>
      <input type="email" formControlName="correoElectronico" placeholder="Ingresar Correo Electrónico" class="w-full h-[56px] border border-gray-300 rounded-lg bg-gray-100 placeholder-border-ip font-semibold text-text-ip font-medium focus:border-border-ip focus:ring-0 focus:outline-none p-[12px_16px]">
    </div>

    <div class="w-full md:w-[440px] sm:w-[342px]">
      <label class="block text-sm pb-2">Teléfono</label>
      <input type="text" formControlName="telefono" placeholder="Ingresar Teléfono" class="w-full h-[56px] border border-gray-300 rounded-lg bg-gray-100 placeholder-border-ip font-semibold text-text-ip font-medium focus:border-border-ip focus:ring-0 focus:outline-none p-[12px_16px]">
    </div>
  </div>

  <div class="w-full md:w-[440px] sm:w-[342px] mt-4">
    <label class="block text-sm pb-2">Nombre de Contacto</label>
    <input type="text" formControlName="contactName" placeholder="Ingresar Nombre de Contacto" class="w-full h-[56px] border border-gray-300 rounded-lg bg-gray-100 placeholder-border-ip font-semibold text-text-ip font-medium focus:border-border-ip focus:ring-0 focus:outline-none p-[12px_16px]">
  </div>
 
  <div>
    <label class="block text-sm pb-2 mt-4">Mensaje (Opcional)</label>
    <textarea formControlName="mensaje" placeholder="Quiero saber más información sobre el proceso de crédito." class="resize-none w-full h-[96px] border border-gray-300 rounded-lg bg-gray-100 placeholder-border-ip font-semibold text-text-ip font-medium focus:border-border-ip focus:ring-0 focus:outline-none p-[12px_16px]"></textarea>
  </div>

  <label class="flex items-center space-x-2 w-full relative w-6 h-6">
    <input type="checkbox" class="hidden peer cursor-pointer">
    <div class="w-6 h-6 border border-button rounded-lg bg-white shrink-0"></div>
    <img src="/icons/Check.svg" alt="Check"
      class="w-6 h-6 absolute rounded-lg top-0 left-0 opacity-0 peer-checked:opacity-100 transition-opacity duration-200">
    <h3 class="text-sm font-medium">
      Autorizo <span class="font-bold text-button cursor-pointer underline">tratamientos de datos</span> según política anexa de WALO
    </h3>
  </label>
  
  <label class="flex items-center space-x-2 w-full relative w-6 h-6">
    <input type="checkbox" class="hidden peer cursor-pointer">
    <div class="w-6 h-6 border border-button rounded-lg bg-white shrink-0"></div>
    <img src="/icons/Check.svg" alt="Check"
      class="w-6 h-6 absolute rounded-lg top-0 left-0 opacity-0 peer-checked:opacity-100 transition-opacity duration-200">
    <h3 class="text-sm font-medium">
      Acepto los nuevos términos y condiciones <span class="font-bold text-button cursor-pointer underline">Ver detalles</span>
    </h3>
  </label>

  <hr class="border-t border-button mt-6 mb-3">
  
  <div class="flex justify-end">
    <button type="submit" class="md:w-[139px] md:h-[56px] md:gap-[16px] md:px-[24px] md:py-[16px] md:rounded-[8px] w-full h-[56px] bg-button text-white rounded-lg font-montserrat font-medium text-[16px] leading-[100%] text-center cursor-pointer">Enviar <img src="/icons/arrow-button.svg" class="w-auto h-auto inline-block"/></button>
  </div>
</form>
