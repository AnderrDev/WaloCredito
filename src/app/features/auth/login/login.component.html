<div class="background bg-blue-bg flex items-center justify-center min-h-screen font-display">
    <!-- Contenedor principal -->
    <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 bg-transparent p-6 lg:m-5 lg:mr-[8vw] 
    rounded-lg w-[80vw] max-w-md lg:max-w-md xl:max-w-lg text-center 
    lg:top-1/2 lg:right-0 lg:left-auto lg:-translate-y-1/2 lg:translate-x-0">
      <h2 class="text-4xl font-bold text-white mb-4">Iniciar Sesión</h2>
  
      <!-- Formulario -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <!-- Teléfono -->
        <div class="font-medium">
          <input 
            type="text" 
            formControlName="phone" 
            placeholder="Teléfono"
            class="w-full h-[56px] border border-gray-300 py-3 px-4 rounded-lg 
                  bg-white placeholder-border-ip font-semibold text-text-ip font-medium 
                  focus:border-border-ip focus:ring-0 focus:outline-none"
          />
          <div *ngIf="loginForm.controls['phone'].invalid && loginForm.controls['phone'].touched" 
               class="text-red-500 text-sm mt-1 text-left">
            El teléfono debe tener 10 dígitos
          </div>
        </div>
        
        <!-- Contraseña -->
        <div>
          <input 
            type="password" 
            formControlName="password" 
            placeholder="Contraseña"
            class="w-full h-[56px] border border-gray-300 py-3 px-4 rounded-lg 
                  bg-white placeholder-border-ip font-semibold text-text-ip font-medium 
                  focus:border-border-ip focus:ring-0 focus:outline-none"
          />
          <div *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched" 
               class="text-red-500 text-sm mt-1 text-left">
            La contraseña debe tener al menos 6 caracteres
          </div>
        </div>
  
        <!-- Botón de Ingresar -->
        <button 
          type="submit" 
          [disabled]="loading || loginForm.invalid"
          class="w-full bg-button text-white p-3 rounded-md hover:bg-blue-600 transition disabled:bg-gray-400 "
        >
          Ingresar
        </button>
  
        <!-- Mensaje de error -->
        <p *ngIf="errorMessage" class="text-red-500 text-sm mt-2">{{ errorMessage }}</p>
  
        <!-- Registro -->
        <p class="text-sm mt-4 text-white">
          No tienes una cuenta? 
          <button type="button" class="text-white rounded-lg font-bold hover:underline cursor-pointer" (click)="goToRegister()">Regístrate</button>
        </p>
      </form>
    </div>
  </div>
